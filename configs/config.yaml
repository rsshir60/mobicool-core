pipeline:
  name: "mobicool_telemetry_churn_predictor"
  version: "1.0.0"
  random_state: 42
  test_size: 0.2

data:
  raw_path: "data/raw/telemetry_events.csv"
  processed_features_path: "data/processed/features.parquet"
  target_column: "churned"

features:
  numerical_features:
    - "session_duration_sec"
    - "events_per_session"
    - "inactivity_days"
    - "total_spend"
  categorical_features:
    - "subscription_tier"
    - "device_os"

model:
  algorithm: "RandomForestClassifier"
  hyperparameters:
    n_estimators: 150
    max_depth: 8
    min_samples_split: 5
    random_state: 42
  artifact_path: "src/models/artifacts/model.joblib"

api:
  host: "0.0.0.0"
  port: 8000
  workers: 2

